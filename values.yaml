# helm upgrade --install loki grafana/loki-stack -f values.yaml
loki:
  enabled: true
  isDefault: true
  # Pod-level security context for Loki
  # fsGroupChangePolicy: "OnRootMismatch" prevents chown on every startup if permissions already match fsGroup.
  # The fsGroup 10001 is a common default for Loki. Verify this for your setup.
  podSecurityContext:
    fsGroup: 10001
    fsGroupChangePolicy: "OnRootMismatch"
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: loki_index_
        period: 24h
  # Configure storage for Loki using the dedicated storageConfig helper.
  # This defines the 's3' object store for chunks and the 'tsdb_shipper' for the index.
  storageConfig:
    aws: # This section defines an S3 backend, implicitly named 's3' by the chart.
      # s3: null # This will be constructed by the chart if bucketnames and region are set
      bucketnames: YOUR_S3_BUCKET_NAME_HERE # Replace with your S3 bucket name
      region: YOUR_AWS_REGION_HERE       # Replace with your AWS region (e.g., us-east-1)
      # s3forcepathstyle: false # Set to true for S3-compatible services that require path-style access
      # For EKS, IRSA (IAM Roles for Service Accounts) is recommended for S3 access.
      # Ensure the serviceAccount used by Loki has the correct IAM role ARN.
      # If not using IRSA, you would configure access_key_id and secret_access_key here:
      # access_key_id: YOUR_AWS_ACCESS_KEY_ID
      # secret_access_key: YOUR_AWS_SECRET_ACCESS_KEY
    tsdb_shipper:
      active_index_directory: /var/loki/tsdb-index # Path on the PVC for active TSDB index files
      shared_store: s3 # Tells tsdb_shipper to use the 's3' object store defined above (via 'aws' config)
      # cache_location: /var/loki/tsdb-cache # Optional: Local cache for TSDB shipper, path on PVC
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: efs-sc # Replace with your StorageClass if different
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1

  # Explicitly configure liveness and readiness probes for Loki
  # to ensure they target the correct port and path.
  livenessProbe:
    httpGet:
      path: /ready  # Standard Loki health endpoint
      port: 3100    # Loki's default HTTP port
    initialDelaySeconds: 60 # Increased delay to allow Loki to start, especially with S3 backend
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /ready  # Standard Loki health endpoint
      port: 3100    # Loki's default HTTP port
    initialDelaySeconds: 30 # Shorter delay for readiness, but still allowing startup
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Service Account configuration for IRSA (IAM Roles for Service Accounts)
  # Ensure you have created an IAM role with permissions to access your S3 bucket
  # and replace the placeholder ARN below.
  serviceAccount:
    create: true # Set to false if you manage the service account externally
    name: loki # Name of the service account, adjust if needed
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/YOUR_LOKI_S3_ACCESS_ROLE_NAME" # Replace with your IAM role ARN
  # The 'loki.config' section has been removed in favor of 'loki.storageConfig' for S3 settings.

minio:
  enabled: false # Disabling Minio as we are using AWS S3
promtail:
  enabled: true
  config:
    lokiAddress: http://loki:3100/loki/api/v1/push
grafana:
  enabled: true
  # initChownData.enabled: false explicitly disables the init container responsible for chown.
  initChownData:
    enabled: false
  sidecar:
    datasources:
      enabled: true
  persistence:
    enabled: true
    chownOnStart: false # Disables the chown operation in the init container for Grafana persistence
    size: 3Gi
    storageClassName: efs-sc # Replace with your StorageClass
  adminUser: admin
  adminPassword: adminadminadmin # Change for production
fluent-bit:
  enabled: false
filebeat:
  enabled: false
logstash:
  enabled: false
prometheus:
  enabled: false
